<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thrift Compass</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link href="https://fonts.googleapis.com/css2?family=Zen+Dots&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --maroon: #6B3035;
      --mustard: #C8962E;
      --stripe-mustard: #E0A526;
      --orange: #C8642C;
      --brown: #5A3A22;
      --teal: #4E9A97;
      --denim: #3E5A7A;
      --ink: #1F1A17;
      --ink-2: #4A423C;
      --ink-3: #7D7268;
      --paper: #F2EBDC;
      --paper-hi: #FAF6EC;
      --line: 2.5px solid var(--ink);
      --bar: 72px;
      --bezel: 14px;
      --slide: .45s cubic-bezier(.32,.72,0,1);
    }
    body { margin: 0; font: 13px/1.45 "Space Mono", monospace; color: var(--ink); background: var(--paper); }
    button { font: inherit; color: inherit; }

    /* nothing on the page can be highlighted, except typing in the search box */
    html, body { user-select: none; -webkit-user-select: none; overscroll-behavior: none; }
    input { user-select: text; -webkit-user-select: text; }
    #topbar, #panel { touch-action: pan-y; }

    /* top bar */
    #topbar {
      position: fixed; z-index: 1001; top: 0; left: 0; right: 0; height: var(--bar); box-sizing: border-box;
      display: flex; align-items: center; gap: 10px; padding: 0 18px;
      padding-bottom: 14px;
      background: linear-gradient(to top, var(--ink) 0 2.5px, var(--brown) 2.5px 6.5px, var(--orange) 6.5px 10.5px, var(--stripe-mustard) 10.5px 14.5px, var(--paper) 14.5px);
      user-select: none; -webkit-user-select: none;
    }
    .mark { position: relative; width: 48px; height: 48px; flex: none; }
    .mark img { position: absolute; }
    .mark .r { inset: 0; width: 100%; }
    .mark .t { left: 47.43%; top: 34.88%; width: 5.73%; height: 31.03%; }
    #topbar h1 { margin: 0; font: 26px/1 "Zen Dots", sans-serif; color: var(--maroon); position: relative; top: 1px; }

    /* map */
    #map { position: fixed; top: var(--bar); left: 0; right: 0; bottom: 0; background: #A8D6D2; }

    /* wood TV bezel around the map */
    #map::before, #map::after { content: ""; position: absolute; z-index: 999; pointer-events: none; }
    #map::before {
      inset: 0; padding: var(--bezel); box-sizing: border-box;
      background:
        repeating-linear-gradient(90deg, rgba(0,0,0,.12) 0 2px, transparent 2px 9px, rgba(255,214,160,.07) 9px 11px, transparent 11px 19px),
        repeating-linear-gradient(90deg, rgba(0,0,0,.08) 0 1px, transparent 1px 37px),
        linear-gradient(#70462A, #5A3A22);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
      mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
    }
    #map::after { inset: var(--bezel); box-shadow: inset 0 0 0 2.5px var(--ink), inset 0 0 26px rgba(31,26,23,.3); }
    .leaflet-bottom.leaflet-right { right: calc(var(--bezel) + 44px); bottom: calc(var(--bezel) + 2px); }

    /* map credits: tucked behind the (i) button */
    #credit {
      position: fixed; z-index: 1000; right: calc(var(--bezel) + 12px); bottom: calc(var(--bezel) + 12px); width: 26px; height: 26px; padding: 0;
      border: 2px solid var(--ink); border-radius: 50%; background: var(--paper-hi); color: var(--ink); font: 700 13px "Space Mono", monospace; cursor: pointer;
    }
    .leaflet-control-attribution { display: none; }
    body.credits .leaflet-control-attribution { display: block; padding: 3px 8px; border: 2px solid var(--ink); border-radius: 6px; background: var(--paper-hi); color: var(--ink); font: 11px "Space Mono", monospace; }
    .leaflet-control-attribution a { color: var(--ink); text-decoration: underline; }
    .leaflet-top.leaflet-right { top: var(--bezel); right: var(--bezel); }

    /* + and - buttons */
    .leaflet-bar.leaflet-control { border: var(--line); border-radius: 8px; box-shadow: 3px 3px 0 var(--ink); overflow: hidden; }
    .leaflet-bar a { width: 34px; height: 34px; line-height: 32px; background: var(--paper-hi); color: var(--ink); font: 700 20px/32px "Space Mono", monospace; border-bottom: 2px solid var(--ink); }
    .leaflet-bar a:last-child { border-bottom: 0; }
    .leaflet-bar a:hover { background: var(--paper); color: var(--maroon); width: 34px; height: 34px; }

    /* little card when you hover a dot */
    .leaflet-tooltip.card { width: 190px; padding: 8px 10px; border: var(--line); border-radius: 8px; background: var(--paper-hi); box-shadow: 3px 3px 0 var(--ink); color: var(--ink); font: 12px "Space Mono", monospace; white-space: normal; }
    .leaflet-tooltip.card::before { display: none; }
    .card b, .card small { display: block; }
    .card small { color: var(--ink-3); margin: 2px 0 6px; }
    .status { font-weight: 700; }
    .status.open { color: #2F7A76; }
    .status.shut { color: var(--maroon); }
    .card .status { margin-bottom: 6px; }

    /* store names when zoomed in close */
    .store-label { width: max-content !important; font: 700 11px "Space Mono", monospace; color: var(--ink); white-space: nowrap; pointer-events: none; text-shadow: -1.5px 0 #F3E7CF, 1.5px 0 #F3E7CF, 0 -1.5px #F3E7CF, 0 1.5px #F3E7CF, 1px 1px #F3E7CF, -1px -1px #F3E7CF; }

    /* sidebar window */
    .win { background: var(--paper); border: var(--line); border-radius: 12px; box-shadow: 6px 6px 0 var(--ink); }
    #panel {
      position: fixed; z-index: 1000; top: calc(var(--bar) + var(--bezel) + 12px); left: calc(var(--bezel) + 12px); bottom: calc(var(--bezel) + 12px); width: min(370px, calc(100vw - 2 * var(--bezel) - 24px));
      display: flex; flex-direction: column; overflow: hidden; user-select: none; -webkit-user-select: none;
      transition: transform var(--slide), opacity .3s;
    }
    body.closed #panel { transform: translateX(calc(-100% - 32px)); opacity: 0; pointer-events: none; }
    .panel-head { display: flex; gap: 10px; padding: 16px 18px 10px; }
    .panel-head .toggle { width: 42px; height: 42px; flex: none; }

    .toggle, .x {
      padding: 0; border: var(--line); border-radius: 8px; background: var(--paper-hi);
      box-shadow: 3px 3px 0 var(--ink); cursor: pointer; display: grid; place-items: center;
      transition: transform 90ms, box-shadow 90ms;
    }
    .toggle { width: 38px; height: 34px; }
    .x { width: 32px; height: 32px; flex: none; }
    .toggle:active, .x:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
    .toggle svg { width: 20px; height: 20px; fill: none; stroke: var(--ink); stroke-width: 2; }
    .x svg { width: 11px; height: 11px; stroke: var(--ink); stroke-width: 2.6; }
    #open { position: fixed; z-index: 1000; top: calc(var(--bar) + var(--bezel) + 12px); left: calc(var(--bezel) + 12px); opacity: 0; pointer-events: none; transition: opacity .2s; }
    body.closed #open { opacity: 1; pointer-events: auto; transition-delay: .2s; }

    /* search */
    .search { position: relative; display: block; flex: 1; min-width: 0; }
    .loc {
      flex: none; width: 34px; height: 34px; padding: 0; border: var(--line); border-radius: 8px; background: var(--paper-hi);
      box-shadow: 3px 3px 0 var(--ink); cursor: pointer; display: grid; place-items: center; transition: transform 90ms, box-shadow 90ms;
    }
    .loc:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
    .loc svg { width: 18px; height: 18px; fill: none; stroke: var(--ink); stroke-width: 2.2; stroke-linejoin: round; }
    .loc.on { background: var(--teal); }
    .loc.on svg { fill: var(--ink); }
    .search input {
      width: 100%; box-sizing: border-box; height: 42px; border: var(--line); border-radius: 8px; padding: 0 12px 0 36px;
      background: var(--paper-hi); font: 13px "Space Mono", monospace; color: var(--ink); outline: none; box-shadow: 4px 4px 0 var(--ink);
    }
    .search input:focus { background: #fff; }
    .search svg { position: absolute; left: 12px; top: 13px; width: 16px; height: 16px; stroke: var(--ink); }

    /* three screens that slide like iPhone settings: tiles -> list -> store */
    .views { position: relative; flex: 1; min-height: 0; overflow: hidden; }
    .view { position: absolute; inset: 0; display: flex; flex-direction: column; transition: transform var(--slide), opacity .3s, visibility .45s; }
    .view.left { transform: translateX(-30%); opacity: 0; visibility: hidden; pointer-events: none; }
    .view.right { transform: translateX(100%); visibility: hidden; pointer-events: none; }
    .scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 0 18px 18px; }

    /* the three tiles */
    .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 16px; }
    .tile {
      display: grid; justify-items: center; gap: 6px; padding: 14px 6px 12px; border: var(--line); border-radius: 10px;
      background: var(--paper-hi); box-shadow: 4px 4px 0 var(--ink); cursor: pointer; transition: transform 90ms, box-shadow 90ms;
    }
    .tile:hover { transform: translate(-1px, -1px); box-shadow: 5px 5px 0 var(--ink); }
    .tile:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
    .tile img { width: 64px; height: 56px; object-fit: contain; filter: drop-shadow(2px 2px 0 rgba(31,26,23,.2)); }
    .tile b { font-size: 12px; text-transform: uppercase; }
    .tile em { font-size: 11px; font-style: normal; color: var(--ink-3); }
    .allbar {
      width: 100%; height: 42px; margin-top: 14px; padding: 0 14px; display: flex; align-items: center; justify-content: space-between;
      border: var(--line); border-radius: 10px; background: var(--paper-hi); box-shadow: 4px 4px 0 var(--ink);
      font-weight: 700; cursor: pointer; transition: transform 90ms, box-shadow 90ms;
    }
    .allbar:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }

    /* filter chips */
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 18px 10px; }
    .chip { height: 30px; padding: 0 12px; border: 2px solid var(--ink); border-radius: 999px; background: var(--paper-hi); font-size: 12px; font-weight: 700; cursor: pointer; }
    .chip[aria-pressed="true"], select.chip.on { background: var(--ink); color: var(--paper); }
    select.chip { appearance: none; padding-right: 26px; font-family: inherit; color: var(--ink);
      background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
      background-position: right 13px center, right 8px center; background-size: 5px 5px; background-repeat: no-repeat; }

    /* list of stores */
    .rhead { display: flex; align-items: flex-end; justify-content: space-between; padding: 6px 18px 10px; border-bottom: 2.5px dashed var(--ink); margin-bottom: 4px; }
    .back { border: 0; background: none; padding: 0; cursor: pointer; font-weight: 700; font-size: 12px; margin-bottom: 4px; }
    .back:hover { color: var(--maroon); }
    .rhead h2 { margin: 0; font-size: 22px; line-height: 1; text-transform: uppercase; }
    .rhead span { font-weight: 700; }
    .rows { list-style: none; margin: 0; padding: 0; }
    .rows li + li { border-top: 2px dotted rgba(31,26,23,.3); }
    .rows button {
      width: 100%; display: grid; grid-template-columns: 12px 1fr auto; gap: 12px; align-items: center; text-align: left;
      padding: 10px 6px; border: 0; border-radius: 6px; background: none; cursor: pointer;
    }
    .rows button:hover { background: rgba(31,26,23,.07); }
    .rows .dot { width: 12px; height: 12px; border: 2px solid var(--ink); border-radius: 50%; box-sizing: border-box; background: var(--maroon); }
    .rows .dot.clothes { background: #E0A526; }
    .rows .dot.vintage { background: #C8642C; }
    .rows div { min-width: 0; }
    .rows b, .rows small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rows small { font-size: 11.5px; color: var(--ink-3); }
    .rows em { font-style: normal; font-weight: 700; font-size: 12px; white-space: nowrap; }

    /* near you */
    .nearhead { display: flex; align-items: center; justify-content: space-between; margin: 24px 0 10px; }
    .near { margin: 0; font-size: 15px; }

    /* what the dot colors mean */
    .key { display: inline-block; width: 10px; height: 10px; border: 2px solid var(--ink); border-radius: 50%; margin-right: 5px; vertical-align: -1px; background: #6B3035; }
    .key.clothes { background: #E0A526; }
    .key.vintage { background: #C8642C; }
    .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btns button {
      height: 40px; border: var(--line); border-radius: 8px; background: var(--paper-hi); font-weight: 700; cursor: pointer;
      box-shadow: 3px 3px 0 var(--ink); transition: transform 90ms, box-shadow 90ms;
    }
    .btns button:first-child { background: var(--maroon); color: var(--paper); }
    .btns button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
    .reset { border: 0; background: none; padding: 8px 0 0; font-weight: 700; font-size: 12px; text-decoration: underline; cursor: pointer; color: var(--ink-3); }
    .dist { margin-top: 6px; font-weight: 700; }

    /* your start on the map */
    .me::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: rgba(78,154,151,.35); animation: ping 2s ease-out infinite; }
    .me::after { content: ""; position: absolute; inset: 5px; border-radius: 50%; background: var(--teal); border: 2.5px solid var(--ink); box-sizing: border-box; }
    @keyframes ping { from { transform: scale(.6); opacity: 1; } to { transform: scale(2); opacity: 0; } }

    /* "tap the map" message */
    #toast {
      position: fixed; z-index: 1002; top: calc(var(--bar) + var(--bezel) + 12px); left: 50%; transform: translateX(-50%);
      display: flex; align-items: center; gap: 12px; padding: 8px 8px 8px 14px; font-weight: 700;
      max-width: calc(100vw - 32px); box-sizing: border-box; box-shadow: 3px 3px 0 var(--ink);
    }
    #toast[hidden] { display: none; }
    #toast button { height: 30px; padding: 0 10px; border: var(--line); border-radius: 6px; background: var(--paper-hi); font-weight: 700; cursor: pointer; }
    body.picking .leaflet-container { cursor: crosshair; }

    /* store page */
    .shead { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 4px 18px 0; }
    .tag { display: inline-block; padding: 3px 8px; border: 2px solid var(--ink); border-radius: 6px; font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--paper); background: var(--maroon); }
    .tag.clothes { background: #E0A526; color: var(--ink); }
    .tag.vintage { background: #C8642C; }
    .tag.soft { background: var(--paper-hi); color: var(--ink); }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .store h2 { margin: 10px 0 4px; font-size: 20px; line-height: 1.2; }
    .store .addr { color: var(--ink-2); }
    .btn {
      display: grid; place-items: center; height: 40px; margin-top: 14px; border: var(--line); border-radius: 8px;
      background: var(--maroon); color: var(--paper); font-weight: 700; text-decoration: none; box-shadow: 3px 3px 0 var(--ink);
      transition: transform 90ms, box-shadow 90ms;
    }
    .btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
    .score {
      display: flex; align-items: center; gap: 14px; margin: 18px 0 14px; padding: 12px 14px; border: var(--line); border-radius: 10px;
      background: var(--paper-hi); box-shadow: 4px 4px 0 var(--ink);
    }
    .score b { font-size: 34px; line-height: 1; }
    .score .stars { color: var(--mustard); font-size: 16px; letter-spacing: 2px; }
    .score small { display: block; color: var(--ink-3); }
    .note { color: var(--ink-3); margin: 18px 0; }
    .review { margin: 0 0 12px; padding: 12px 14px; border: 2px solid var(--ink); border-radius: 10px; background: var(--paper-hi); cursor: pointer; }
    .review header { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 6px; font-weight: 700; }
    .review header span { color: var(--mustard); letter-spacing: 1px; white-space: nowrap; }
    .review p { margin: 0; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
    .review.open p { -webkit-line-clamp: unset; }
    .more { display: inline-block; margin-top: 4px; color: var(--maroon); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }

    /* intro: radial wipe, needle settles, logo flies into the top bar */
    @property --sweep { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
    #intro { position: fixed; inset: 0; z-index: 5000; background: var(--paper); display: grid; place-items: center; }
    #intro[hidden] { display: none; }
    #logo { position: relative; width: min(56vw, 320px); aspect-ratio: 1; transform-origin: 0 0; }
    #logo .wipe {
      position: absolute; inset: 0;
      -webkit-mask-image: conic-gradient(from 0deg, #000 var(--sweep), transparent calc(var(--sweep) + 0.5deg));
      mask-image: conic-gradient(from 0deg, #000 var(--sweep), transparent calc(var(--sweep) + 0.5deg));
    }
    #logo img { position: absolute; display: block; }
    #logo .ring { left: 0; top: 0; width: 100%; height: 100%; }
    #logo .tie { left: 47.43%; top: 34.88%; width: 5.73%; height: 31.03%; transform-origin: 50% 100%; opacity: 0; }
  </style>
</head>
<body>
  <div id="intro" hidden aria-hidden="true">
    <div id="logo"><div class="wipe"><img class="ring" src="img/ring.png" alt=""><img class="tie" src="img/tie.png" alt=""></div></div>
  </div>

  <header id="topbar">
    <div class="mark" id="mark"><img class="r" src="img/ring.png" alt=""><img class="t" src="img/tie.png" alt=""></div>
    <h1>thrift compass</h1>
  </header>

  <div id="map"></div>

  <aside id="panel" class="win">
    <div class="panel-head">
      <label class="search">
        <svg viewBox="0 0 16 16" fill="none" stroke-width="2.2" stroke-linecap="round"><circle cx="7" cy="7" r="5"/><path d="m11 11 3.5 3.5"/></svg>
        <input id="q" type="search" placeholder="Search stores" autocomplete="off">
      </label>
      <button class="toggle" id="close" aria-label="Hide sidebar">
        <svg viewBox="0 0 20 20"><rect x="2" y="3" width="16" height="14" rx="3"/><path d="M8 3v14M4.5 7h1.5M4.5 10h1.5"/></svg>
      </button>
    </div>
    <div class="chips">
      <button class="chip" data-own="independent" aria-pressed="false">Local</button>
      <button class="chip" data-own="chain" aria-pressed="false">Chain</button>
      <button class="chip" data-tag="charity" aria-pressed="false">Charity</button>
      <button class="chip" data-tag="consignment" aria-pressed="false">Consignment</button>
      <select class="chip" id="maxDist" aria-label="Distance">
        <option value="">Any distance</option><option value="5">Within 5 mi</option>
        <option value="10">Within 10 mi</option><option value="20">Within 20 mi</option>
      </select>
    </div>

    <div class="views">
      <div class="view" id="vBrowse">
        <div class="scroll">
          <div class="tiles">
            <button class="tile" data-kind="thrift"><img src="img/cats/thrift.png" alt=""><b>Thrift stores</b><em><i class="key thrift"></i><span id="n_thrift"></span></em></button>
            <button class="tile" data-kind="clothes"><img src="img/cats/clothes.png" alt=""><b>Clothes</b><em><i class="key clothes"></i><span id="n_clothes"></span></em></button>
            <button class="tile" data-kind="vintage"><img src="img/cats/vintage.png" alt=""><b>Vintage</b><em><i class="key vintage"></i><span id="n_vintage"></span></em></button>
          </div>
          <button class="allbar" data-kind="all"><span>All stores</span><span id="nAll"></span></button>
          <div class="nearhead"><h3 class="near">Near you</h3><button class="loc" id="loc" aria-label="Use my location"><svg viewBox="0 0 18 18"><path d="M15.5 2.5 2.5 8l6 1.5L10 15.5z"/></svg></button></div>
          <div id="nearBox"></div>
        </div>
      </div>

      <div class="view right" id="vList">
        <div class="rhead">
          <div><button class="back" id="back">◀ Back</button><h2 id="title"></h2></div>
          <span id="count"></span>
        </div>
        <div class="scroll"><ul class="rows" id="list"></ul></div>
      </div>

      <div class="view right store" id="vStore">
        <div class="shead">
          <div class="tags" id="sTags"></div>
          <button class="x" id="sClose" aria-label="Close store"><svg viewBox="0 0 10 10"><path d="M1 1l8 8M9 1 1 9"/></svg></button>
        </div>
        <div class="scroll">
          <h2 id="sName"></h2>
          <div class="addr" id="sAddr"></div>
          <div class="dist" id="sDist"></div>
          <div id="sHours"></div>
          <a class="btn" id="sDir" target="_blank" rel="noopener">Directions</a>
          <div id="sReviews"></div>
        </div>
      </div>
    </div>
  </aside>

  <div id="toast" class="win" hidden><span id="toastMsg"></span><button id="toastX">Cancel</button></div>

  <button id="credit" aria-label="Map credits" aria-expanded="false">i</button>

  <button class="toggle" id="open" aria-label="Show sidebar">
    <svg viewBox="0 0 20 20"><rect x="2" y="3" width="16" height="14" rx="3"/><path d="M8 3v14M4.5 7h1.5M4.5 10h1.5"/></svg>
  </button>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.1.3/leaflet-maplibre-gl.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

    // stop accidental pinch zoom on the page. The map still zooms because Leaflet handles its own pinch.
    document.addEventListener("wheel", e => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
    document.addEventListener("gesturestart", e => e.preventDefault());

    const map = L.map("map", { zoomControl: false }).setView([37.2707, -76.7075], 10);
    L.control.zoom({ position: "topright" }).addTo(map);

    // credits show when the map opens, then tuck behind the (i) after 5 seconds or the first time you move the map
    map.attributionControl.setPrefix('<a href="https://leafletjs.com" target="_blank">Leaflet</a>');
    const creditBtn = document.getElementById("credit");
    function showCredits(on) {
      document.body.classList.toggle("credits", on);
      creditBtn.setAttribute("aria-expanded", on);
    }
    showCredits(true);
    setTimeout(() => showCredits(false), 5000);
    map.once("movestart zoomstart", () => showCredits(false));
    creditBtn.onclick = () => showCredits(!document.body.classList.contains("credits"));

    /* ---------- the map style: free OpenFreeMap tiles, recolored to match the site ---------- */
    const ATTRIBUTION = '<a href="https://openfreemap.org" target="_blank">OpenFreeMap</a> &copy; <a href="https://www.openmaptiles.org/" target="_blank">OpenMapTiles</a> Data from <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a>';
    const MAP_COLORS = [
      [/^background$/, "background-color", "#F3E7CF"],
      [/^water$/, "fill-color", "#8FC7C2"],
      [/^waterway$/, "line-color", "#8FC7C2"],
      [/^(park|landcover_wood)$/, "fill-color", "#E3DCB4"],
      [/^landuse_residential$/, "fill-color", "#EFE1C6"],
      [/^building$/, "fill-color", "#E6D6B6"],
      [/^(highway_path|highway_minor)$/, "line-color", "#DCC8A3"],
      [/^highway_major_(inner|subtle)$/, "line-color", "#B98F62"],
      [/^highway_major_casing$/, "line-color", "#A67C52"],
      [/^(tunnel_)?highway_motorway_(inner|subtle|bridge_inner)$|^tunnel_motorway_inner$/, "line-color", "#9A6B45"],
      [/motorway.*casing/, "line-color", "#7E5536"],
    ];
    const MAP_HIDE = /^(ne2_shaded|boundary|railway|aeroway|airport|road_shield|highway-shield|road_area_pier|road_pier|label_country|landcover_(ice|glacier))/;

    fetch("https://tiles.openfreemap.org/styles/positron")
      .then(r => r.json())
      .then(style => {
        style.layers = style.layers.filter(l => !MAP_HIDE.test(l.id));
        style.layers.forEach(l => {
          l.paint = l.paint || {};
          MAP_COLORS.forEach(([match, prop, color]) => { if (match.test(l.id)) l.paint[prop] = color; });
          if (l.type === "symbol") { l.paint["text-color"] = "#5A3A22"; l.paint["text-halo-color"] = "#F3E7CF"; l.paint["text-halo-width"] = 1.6; }
        });
        L.maplibreGL({ style, attribution: ATTRIBUTION }).addTo(map);
      })
      .catch(() => L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { attribution: "&copy; OpenStreetMap contributors" }).addTo(map));

    // sidebar hide / show
    $("close").onclick = () => document.body.classList.add("closed");
    $("open").onclick = () => document.body.classList.remove("closed");

    function esc(t) {
      const d = document.createElement("div");
      d.textContent = t ?? "";
      return d.innerHTML;
    }

    // Caroline's tags decide the box: vintage first, then consignment or clothing stores, everything else is a thrift store
    const KINDS = { thrift: "Thrift stores", clothes: "Clothes", vintage: "Vintage" };
    const PIN = { thrift: "#6B3035", clothes: "#E0A526", vintage: "#C8642C" };
    const has = (s, tag) => (s.tags || "").split("|").includes(tag);
    const kindOf = s => has(s, "vintage") ? "vintage"
      : has(s, "consignment") || s.category === "second_hand_clothing_store" ? "clothes" : "thrift";
    const titles = { all: "All stores", ...KINDS };
    // what the shopper wants: the same three inputs as Caroline's recommend_stores()
    const want = { ownership: new Set(), tags: new Set(), maxDist: null };
    let stores = [], markers = [], kind = null, query = "", selected = null;
    let start = null, startKind = null, startDot = null, order = [];

    // miles between two [lat, lon] points on the real (slightly squashed) earth,
    // the same answer as geopy's geodesic() in Caroline's code (Vincenty's formula)
    function miles(p, q) {
      const r = Math.PI / 180, A = 6378137, f = 1 / 298.257223563, B = A * (1 - f);
      const U1 = Math.atan((1 - f) * Math.tan(p[0] * r)), U2 = Math.atan((1 - f) * Math.tan(q[0] * r)), L = (q[1] - p[1]) * r;
      const s1 = Math.sin(U1), c1 = Math.cos(U1), s2 = Math.sin(U2), c2 = Math.cos(U2);
      let lam = L, sinS, cosS, sig, cos2a, cos2m;
      for (let k = 0; k < 100; k++) {
        const sl = Math.sin(lam), cl = Math.cos(lam);
        sinS = Math.hypot(c2 * sl, c1 * s2 - s1 * c2 * cl);
        if (sinS === 0) return 0;
        cosS = s1 * s2 + c1 * c2 * cl; sig = Math.atan2(sinS, cosS);
        const sa = c1 * c2 * sl / sinS; cos2a = 1 - sa * sa;
        cos2m = cos2a ? cosS - 2 * s1 * s2 / cos2a : 0;
        const C = f / 16 * cos2a * (4 + f * (4 - 3 * cos2a)), prev = lam;
        lam = L + (1 - C) * f * sa * (sig + C * sinS * (cos2m + C * cosS * (2 * cos2m * cos2m - 1)));
        if (Math.abs(lam - prev) < 1e-12) break;
      }
      const u2 = cos2a * (A * A - B * B) / (B * B);
      const AA = 1 + u2 / 16384 * (4096 + u2 * (-768 + u2 * (320 - 175 * u2))), BB = u2 / 1024 * (256 + u2 * (-128 + u2 * (74 - 47 * u2)));
      const dS = BB * sinS * (cos2m + BB / 4 * (cosS * (2 * cos2m * cos2m - 1) - BB / 6 * cos2m * (4 * sinS * sinS - 3) * (4 * cos2m * cos2m - 3)));
      return B * AA * (sig - dS) / 1609.344;
    }
    const dist = i => start ? miles(start, [stores[i].lat, stores[i].lon]) : null;
    // closest first, then by name, like recommend_stores()
    function sortStores() {
      order = stores.map((_, i) => i);
      if (start) order.sort((a, b) => dist(a) - dist(b) || (stores[a].name < stores[b].name ? -1 : stores[a].name > stores[b].name ? 1 : 0));
    }

    /* ---------- which screen the sidebar shows ---------- */
    const screens = ["vBrowse", "vList", "vStore"];
    let screen = 0, before = 0;
    function show(n) {
      screens.forEach((id, i) => {
        $(id).classList.toggle("left", i < n);
        $(id).classList.toggle("right", i > n);
      });
      screen = n;
    }

    /* ---------- list ---------- */
    // Caroline's recommend_stores() rules (recommendations/recommendations.py):
    // ownership is any of the picks, tags need at least one match, distance only counts once there's a start
    function passes(s) {
      if (want.ownership.size && !want.ownership.has(s.ownership)) return false;
      if (want.tags.size && !(s.tags || "").split("|").some(t => want.tags.has(t))) return false;
      if (want.maxDist !== null && start && miles(start, [s.lat, s.lon]) > want.maxDist) return false;
      return true;
    }
    const picking = () => want.ownership.size || want.tags.size || want.maxDist !== null;

    function matches(s) {
      if (kind && kind !== "all" && kindOf(s) !== kind) return false;
      if (!passes(s)) return false;
      return !query || `${s.name} ${s.address} ${s.city}`.toLowerCase().includes(query);
    }

    function drawList() {
      const active = kind || query || picking();
      let html = "", n = 0;
      order.forEach(i => {
        const s = stores[i], ok = !active || matches(s);
        if (i !== selected) markers[i].setStyle({ opacity: ok ? 1 : 0.2, fillOpacity: ok ? 1 : 0.2 });
        if (active && ok) {
          n++;
          html += `<li><button data-i="${i}"><i class="dot ${kindOf(s)}"></i>` +
                  `<div><b>${esc(s.name)}</b><small>${esc(s.address)}, ${esc(s.city)}</small></div><em>${start ? dist(i).toFixed(1) + " mi" : ""}</em></button></li>`;
        }
      });
      $("list").innerHTML = html || `<li style="padding:16px 6px;color:var(--ink-3)">Nothing matches.</li>`;
      $("title").textContent = query ? "Results" : titles[kind] || "";
      $("count").textContent = n;
      for (const k in KINDS) $("n_" + k).textContent = stores.filter(s => kindOf(s) === k && passes(s)).length;
      $("nAll").textContent = stores.filter(passes).length;
      drawNear();
      drawLabels();
    }

    function drawNear() {
      $("nearBox").innerHTML = start
        ? `<ul class="rows">${order.filter(i => passes(stores[i])).slice(0, 5).map(i => `<li><button data-i="${i}"><i class="dot ${kindOf(stores[i])}"></i><div><b>${esc(stores[i].name)}</b><small>${esc(stores[i].city)}</small></div><em>${dist(i).toFixed(1)} mi</em></button></li>`).join("")}</ul>`
        + `<button class="reset" data-act="reset">Change start</button>`
        : `<div class="btns"><button data-act="locate">Use my location</button><button data-act="pick">Pick on map</button></div>`;
      $("loc").classList.toggle("on", startKind === "me");
    }

    function showList(k) { kind = k; drawList(); show(1); }

    document.querySelectorAll(".tile, .allbar").forEach(t => t.onclick = () => showList(t.dataset.kind));
    document.querySelectorAll("button.chip").forEach(c => c.onclick = () => {
      const set = c.dataset.own ? want.ownership : want.tags, v = c.dataset.own || c.dataset.tag, on = !set.has(v);
      if (on) set.add(v); else set.delete(v);
      c.setAttribute("aria-pressed", on);
      drawList();
    });
    $("maxDist").onchange = e => {
      want.maxDist = e.target.value ? +e.target.value : null;
      e.target.classList.toggle("on", want.maxDist !== null);
      if (want.maxDist !== null && !start) locate();  // distance needs a start point first
      drawList();
    };
    $("back").onclick = () => { kind = null; query = ""; $("q").value = ""; drawList(); show(0); };
    $("q").addEventListener("input", e => {
      query = e.target.value.trim().toLowerCase();
      if (query) { deselect(); showList(kind || "all"); } else drawList();
    });
    $("list").addEventListener("click", e => {
      const b = e.target.closest("button[data-i]");
      if (b) select(+b.dataset.i);
    });
    $("nearBox").addEventListener("click", e => {
      const b = e.target.closest("button[data-i]");
      if (b) return select(+b.dataset.i);
      const a = e.target.closest("[data-act]");
      if (!a) return;
      if (a.dataset.act === "locate") locate();
      else if (a.dataset.act === "pick") pick(true);
      else clearStart();
    });

    /* ---------- where you start: your location, or a spot you tap on the map ---------- */
    function setStart(lat, lon, how) {
      start = [lat, lon]; startKind = how;
      if (!startDot) startDot = L.marker(start, { icon: L.divIcon({ className: "me", iconSize: [22, 22] }), interactive: false }).addTo(map);
      else startDot.setLatLng(start);
      sortStores(); drawList();
      if (selected !== null) showDistance(stores[selected]);
    }

    function clearStart() {
      start = null; startKind = null;
      if (startDot) { startDot.remove(); startDot = null; }
      sortStores(); drawList();
      if (selected !== null) showDistance(stores[selected]);
    }

    function pick(on, msg) {
      document.body.classList.toggle("picking", on);
      $("toast").hidden = !on;
      $("toastMsg").textContent = msg || "Tap the map to set your start";
    }
    $("toastX").onclick = () => pick(false);
    map.on("click", e => {
      if (!document.body.classList.contains("picking")) return;
      setStart(e.latlng.lat, e.latlng.lng, "map");
      pick(false);
    });

    function locate() {
      if (!navigator.geolocation) return pick(true, "Location's off. Tap the map instead.");
      navigator.geolocation.getCurrentPosition(p => {
        const here = [p.coords.latitude, p.coords.longitude];
        if (miles(here, [37.2707, -76.7075]) > 45) return pick(true, "You're too far away. Tap the map instead.");
        setStart(here[0], here[1], "me");
        map.flyTo(here, 12, { duration: reduceMotion ? 0 : 0.8 });
      }, () => pick(true, "Location's off. Tap the map instead."), { timeout: 8000, maximumAge: 300000 });
    }
    $("loc").onclick = locate;

    /* ---------- store page ---------- */
    function markerStyle(i, on) {
      const m = markers[i];
      m.setStyle(on ? { radius: 11, weight: 3.5, opacity: 1, fillOpacity: 1 } : { radius: 6, weight: 2.5 });
      if (on) m.bringToFront();
    }

    function deselect() {
      if (selected !== null) markerStyle(selected, false);
      selected = null;
    }

    function select(i) {
      deselect();
      selected = i;
      const s = stores[i];
      markerStyle(i, true);
      document.body.classList.remove("closed");

      $("sTags").innerHTML = tagPills(s);
      $("sHours").innerHTML = statusHtml(s);
      $("sName").textContent = s.name;
      $("sAddr").textContent = `${s.address}, ${s.city}`;
      showDistance(s);
      $("vStore").querySelector(".scroll").scrollTop = 0;
      showReviews(s);

      if (screen !== 2) before = screen;
      show(2);

      // fly so the store lands in the middle of the map you can see, not under the sidebar
      const zoom = Math.max(map.getZoom(), 13);
      const shift = $("panel").getBoundingClientRect().right / 2;
      const center = map.unproject(map.project([s.lat, s.lon], zoom).subtract([shift, 0]), zoom);
      map.flyTo(center, zoom, { duration: reduceMotion ? 0 : 0.8 });
    }

      function showDistance(s) {
      const i = stores.indexOf(s);
      $("sDist").textContent = start ? `${dist(i).toFixed(1)} mi away` : "";
      $("sDir").href = `https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lon}` + (start ? `&origin=${start[0]},${start[1]}` : "");
    }

    $("sClose").onclick = () => {
      deselect();
      kind = null; query = ""; $("q").value = "";
      drawList();
      show(0);
      map.flyTo([37.2707, -76.7075], 10, { duration: reduceMotion ? 0 : 0.8 });
    };

    /* ---------- reviews ---------- */
    const reviewCache = {};
    const stars = n => "★".repeat(Math.round(n)) + "☆".repeat(5 - Math.round(n));

    function showReviews(s) {
      const box = $("sReviews");
      if (!s.google_id) { box.innerHTML = `<p class="note">No Google reviews for this store yet.</p>`; return; }
      if (reviewCache[s.google_id]) { renderReviews(reviewCache[s.google_id]); return; }
      box.innerHTML = `<p class="note">Loading reviews...</p>`;
      const id = s.google_id;
      fetch(`/api/reviews?id=${id}`)
        .then(r => r.json())
        .then(d => {
          if (d.error) throw d.error;
          reviewCache[id] = d;
          // keep Google's hours so hovering this store works from now on
          if (d.hours && d.hours.length) stores.filter(x => x.google_id === id).forEach(x => x.hours = d.hours);
          if (stores[selected] && stores[selected].google_id === id) $("sHours").innerHTML = statusHtml(stores[selected]);
          if (stores[selected] && stores[selected].google_id === id) renderReviews(d);
        })
        .catch(() => {
          if (stores[selected] && stores[selected].google_id === id) box.innerHTML = `<p class="note">Couldn't load reviews right now.</p>`;
        });
    }

    function renderReviews(d) {
      if (!d.rating) { $("sReviews").innerHTML = `<p class="note">No ratings on Google yet.</p>`; return; }
      $("sReviews").innerHTML =
        `<div class="score"><b>${d.rating.toFixed(1)}</b><div><span class="stars">${stars(d.rating)}</span><small>${d.count} reviews on Google</small></div></div>` +
        d.reviews.map(rv => `<article class="review"><header>${esc(rv.author)}<span>${stars(rv.rating)}</span></header><p>${esc(rv.text)}</p></article>`).join("") +
        `<a class="more" href="${d.url}" target="_blank" rel="noopener">See all on Google Maps</a>`;
    }

    // tap a review to read all of it
    $("sReviews").addEventListener("click", e => {
      const r = e.target.closest(".review");
      if (r) r.classList.toggle("open");
    });

    function tagPills(s) {
      const k = kindOf(s);
      return `<span class="tag ${k}">${KINDS[k]}</span>` +
        (s.ownership === "independent" ? `<span class="tag soft">Local</span>` : "") +
        (has(s, "charity") ? `<span class="tag soft">Charity</span>` : "");
    }

    /* ---------- open or closed right now, in Virginia time. Hours come from OpenStreetMap or from the Google call a click already makes ---------- */
    const WEEK = 7 * 24 * 60, DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
    function nowInVirginia() {
      const p = {};
      new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", weekday: "short", hour: "numeric", minute: "numeric", hourCycle: "h23" })
        .formatToParts(new Date()).forEach(x => p[x.type] = x.value);
      return DAYS.indexOf(p.weekday) * 1440 + (+p.hour) * 60 + (+p.minute);
    }
    function clock(m) {
      m = m % 1440;
      const h = Math.floor(m / 60), min = m % 60;
      return `${h % 12 || 12}${min ? ":" + String(min).padStart(2, "0") : ""} ${h < 12 ? "AM" : "PM"}`;
    }
    // returns { open, text }, or null when we don't have hours for that store
    function hoursStatus(s) {
      const h = typeof s.hours === "string" ? JSON.parse(s.hours) : s.hours;
      if (!h || !h.length) return null;
      if (h.length === 1 && h[0][0] === 0 && h[0][1] === WEEK) return { open: true, text: "Open 24 hours" };
      const now = nowInVirginia();
      const period = h.find(([a, b]) => (now >= a && now < b) || (now + WEEK >= a && now + WEEK < b));
      if (period) return { open: true, text: `Open until ${clock(period[1])}` };
      const next = h.map(([a]) => a).sort((x, y) => ((x - now + WEEK) % WEEK) - ((y - now + WEEK) % WEEK))[0];
      const sameDay = Math.floor(next / 1440) === Math.floor(now / 1440) && next > now;
      return { open: false, text: `Closed until ${sameDay ? "" : DAYS[Math.floor(next / 1440)] + " "}${clock(next)}` };
    }
    function statusHtml(s) {
      const st = hoursStatus(s);
      return st ? `<div class="status ${st.open ? "open" : "shut"}">${st.text}</div>` : "";
    }

    function hoverCard(s) {
      const away = start ? ` · ${dist(stores.indexOf(s)).toFixed(1)} mi` : "";
      return `<b>${esc(s.name)}</b><small>${esc(s.city)}${away}</small>${statusHtml(s)}<div class="tags">${tagPills(s)}</div>`;
    }

    /* ---------- store names on the map when you're zoomed in close ---------- */
    const LABEL_ZOOM = 13;
    const labels = L.layerGroup().addTo(map);
    function drawLabels() {
      labels.clearLayers();
      if (map.getZoom() < LABEL_ZOOM || !markers.length) return;
      const active = kind || query || picking(), bounds = map.getBounds(), taken = [];
      // the selected store gets its name first, then skip any name that would overlap one already placed
      const ids = selected === null ? order : [selected, ...order.filter(i => i !== selected)];
      ids.forEach(i => {
        const s = stores[i];
        if ((active && !matches(s)) || !bounds.contains([s.lat, s.lon])) return;
        const p = map.latLngToContainerPoint([s.lat, s.lon]);
        const box = { l: p.x + 10, t: p.y - 9, r: p.x + 14 + s.name.length * 6.8, b: p.y + 9 };
        if (taken.some(o => box.l < o.r && box.r > o.l && box.t < o.b && box.b > o.t)) return;
        taken.push(box);
        L.marker([s.lat, s.lon], {
          interactive: false, keyboard: false,
          icon: L.divIcon({ className: "store-label", html: esc(s.name), iconSize: null, iconAnchor: [-10, 8] })
        }).addTo(labels);
      });
    }
    map.on("moveend zoomend", drawLabels);

    /* ---------- stores + map dots ---------- */
    fetch("data/stores.json")
      .then(r => r.json())
      .then(data => {
        stores = data.sort((a, b) => a.name.localeCompare(b.name));
        sortStores();

        markers = stores.map((s, i) => {
          const m = L.circleMarker([s.lat, s.lon], {
            radius: 6, color: "#1F1A17", weight: 2.5, fillColor: PIN[kindOf(s)], fillOpacity: 1
          }).addTo(map);
          m.on("click", () => { if (!document.body.classList.contains("picking")) select(i); });
          m.bindTooltip(() => hoverCard(s), { direction: "top", offset: [0, -8], opacity: 1, className: "card" });
          return m;
        });
        drawList();
      });

    /* ---------- intro, once per visit ---------- */
    function playIntro() {
      const intro = $("intro"), logo = $("logo"), wipe = logo.querySelector(".wipe"), tie = logo.querySelector(".tie");
      const finish = () => { intro.hidden = true; $("mark").style.visibility = ""; };
      intro.hidden = false;
      $("mark").style.visibility = "hidden";

      if (reduceMotion) {
        tie.style.opacity = 1;
        setTimeout(() => intro.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 300, fill: "forwards" }).finished.then(finish), 500);
        return;
      }

      // 1. the ring sweeps in clockwise from north
      wipe.animate([{ "--sweep": "0deg" }, { "--sweep": "360deg" }], { duration: 950, delay: 150, easing: "cubic-bezier(.45,0,.2,1)", fill: "both" });
      // 2. the tie fades in, swings on its base, and settles on north
      tie.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 250, delay: 1050, fill: "both" });
      const swing = [];
      for (let i = 0; i <= 60; i++) {
        const t = i / 60;
        swing.push({ rotate: (28 * Math.exp(-4.5 * t) * Math.sin(2 * Math.PI * 2.5 * t)).toFixed(2) + "deg" });
      }
      // 3. the compass flies into the top bar while the page shows through
      tie.animate(swing, { duration: 1200, delay: 1250, fill: "both" }).finished.then(() => {
        const a = logo.getBoundingClientRect(), b = $("mark").getBoundingClientRect();
        logo.animate([{ transform: "none" }, { transform: `translate(${b.left - a.left}px, ${b.top - a.top}px) scale(${b.width / a.width})` }],
          { duration: 700, delay: 150, easing: "cubic-bezier(.3,0,.1,1)", fill: "forwards" }).finished.then(finish);
        intro.animate([{ backgroundColor: "rgba(242,235,220,1)" }, { backgroundColor: "rgba(242,235,220,0)" }],
          { duration: 650, delay: 200, easing: "ease-in-out", fill: "forwards" });
      });
    }

    let seen = false;
    try { seen = sessionStorage.getItem("tc-intro-seen") === "1"; sessionStorage.setItem("tc-intro-seen", "1"); } catch (e) {}
    if (!seen) playIntro();
  </script>
</body>
</html>
